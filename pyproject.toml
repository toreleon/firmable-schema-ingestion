[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reviewable-ingestion"
version = "0.2.0"
description = "Checkpointed agentic schema inference and conservative business resolution"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6,<7", "openpyxl>=3.1,<4", "regex>=2024.0"]

[project.scripts]
ingest = "ingest.cli:main"

[tool.setuptools.packages.find]
include = ["ingest*"]
